name: omniC
channels:
  - conda-forge
dependencies:
  # Python 3.11 keeps the ML/video ecosystem broad and stable.
  - python=3.11
  - pip
  - ffmpeg
  - git
  - pip:
      # CUDA 13.0 PyTorch wheels support the local RTX 5090 driver stack.
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.12.0+cu130
      - torchvision==0.27.0+cu130
      - torchaudio==2.11.0+cu130

      # Model training, embedding, and retrieval foundations.
      - transformers==5.9.0
      - accelerate==1.13.0
      - datasets==4.8.5
      - sentence-transformers==5.5.1
      - timm==1.0.27
      - einops==0.8.2
      - faiss-cpu==1.14.2
      - qwen-vl-utils==0.0.14

      # Video, slide, and data processing.
      - opencv-python-headless==4.13.0.92
      - av==17.0.1
      - pymupdf==1.27.2.3
      - pandas==3.0.3
      - scipy==1.17.1
      - scikit-learn==1.8.0
      - matplotlib==3.10.9
      - tqdm==4.67.3

      # App, notebook, and development tooling.
      - fastapi==0.136.3
      - uvicorn[standard]==0.48.0
      - gradio==6.15.1
      - jupyterlab==4.5.7
      - ipykernel==7.2.0
      - pydantic==2.13.4
      - pyyaml==6.0.3
      - python-dotenv==1.2.2
      - rich==15.0.0
      - typer==0.25.1
      - pytest==9.0.3
      - ruff==0.15.15
      - black==26.5.1
      - pre-commit==4.6.0
